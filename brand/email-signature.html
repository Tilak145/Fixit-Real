<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FixIt email signature</title>
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  body { width: 560px; height: 168px; font-family: "Segoe UI", Arial, sans-serif; color: #1A2333; }
  .sig { display: flex; align-items: center; gap: 22px; padding: 24px 26px; height: 120px; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-right: 26px; flex: none; border-right: 3px solid #F57C00; height: 100%; justify-content: center; }
  .word { font-size: 30px; font-weight: 700; line-height: 1; color: #0D2C54; letter-spacing: -0.5px; }
  .word span { color: #F57C00; }
  .sub { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; color: #1565C0; white-space: nowrap; }
  .who { font-size: 19px; font-weight: 700; color: #0D2C54; line-height: 1.2; }
  .role { font-size: 13px; font-weight: 600; color: #1565C0; margin-top: 2px; }
  .lines { margin-top: 10px; font-size: 13.5px; line-height: 1.65; color: #1A2333; }
  .lines b { display: inline-block; width: 18px; color: #F57C00; font-weight: 700; }
  .tag { margin-top: 8px; font-size: 11.5px; color: #5A6B80; font-style: italic; }
</style>
</head>
<body>
  <div class="sig">
    <div class="brand">
      <svg width="62" height="53" viewBox="0 0 40 34" aria-hidden="true">
        <path d="M20 1 2 16h6v17h24V16h6z" fill="#1565C0"/>
        <circle cx="20" cy="17" r="10" fill="#FFFFFF"/>
        <path d="M25.5 11.5a7 7 0 1 0 3 7.5l-4-1a3 3 0 1 1-2-3.5z" fill="#F57C00"/>
      </svg>
      <div>
        <div class="word">Fix<span>It</span></div>
      </div>
      <div class="sub">LOCAL SERVICES</div>
    </div>
    <div>
      <div class="who">FixIt Support Team</div>
      <div class="role">Customer &amp; Pro Support</div>
      <div class="lines">
        <div><b>E</b>support@fixitls.com</div>
        <div><b>W</b>www.fixitls.com</div>
      </div>
      <div class="tag">Trusted local home service pros in Akron, OH</div>
    </div>
  </div>
</body>
</html>
